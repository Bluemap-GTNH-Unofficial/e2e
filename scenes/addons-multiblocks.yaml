# Community addon multiblocks (`orch --server gtnh-addons --port 25568 --rcon-port 25578 scene addons-multiblocks`,
# testing/orchestrator/src/orchestrator/addon_scenes.py): structures built with StructureLib (survival, formed; Box++
# creative) around controllers at y=20, z=0, facing north, structures extending south; superflat ground at y=4.
# Controllers at x: TST artificial star 0, laser meteor miner 35, large solar boiler 58, eye of wood 88, intensify
# chemical distorter 117, magnetic mixer 139, miracle top 166; GTNL mega EBF 195, large circuit assembler 215, large
# steam furnace 231, meteor miner 251, large bronze boiler 269, nano phagocytosis plant 288; 123T SINOPEC 327, fire
# rocket assembler 387, mega QFT 422, mega Isa forge 478; NHU arcane EBF 519; PH programming circuit provider 529;
# Box++ encapsulator 549.
# TESR row on a stone floor (y=4) at y=5, z=-48, x = 0, 8, ..., 184: TST star, laser beacon, eye of wood render, solar
# boiler render, arcane hole, power chair; GTNL beam former, laser beacon, essentia jar, essentia tube, artificial star
# render, EGTW render, nano phagocytosis render, player doll, fumo, water candle, ender elevator; Box++ rings 1-3; 123T
# rocket, Ayanami, Asuka, tall hat.
# Active TESR row (tile entity NBT set with bmh te-nbt), y=5, z=-64: TST laser beacon (red beam, range 20) x 0, GTNL
# laser beacon (blue, range 12) x 12, TST star (renderStatus 1) x 24, GTNL essentia jar (ignis + aqua) x 36, two GTNL
# beam formers facing each other x 48 z -64 / -58, GTNL ender elevator meta 14 x 60, fumo meta 5 x 68, player doll
# meta 3 x 76, Box++ ring 1 switched on (3 rings, scale 0.3) x 100.
world: addons-multiblocks
extra_packs: [out/exporter-addons/bluemap-gtnh-resources-2.9.0-RC-2-addons.zip]
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: 0.02       # report-only until the addon TESR renderers land

