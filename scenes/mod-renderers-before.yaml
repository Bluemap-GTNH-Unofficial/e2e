# BEFORE: the same scene with the mod renderer keys stripped from the export (static captures / bounding boxes).
# Mod renderers (`orch scene mod-renderers`, testing/orchestrator/src/orchestrator/mod_scenes.py): superflat, stone
# floor y=4, blocks from y=5. Chisel samples (3x3x3 cubes, pillars, rows) x 0..75 z 0..7; Iron Chests z 12..14;
# BiblioCraft z 18..24; AE2 controller/drive + cable lines with parts z 30..38; EnderIO conduit lines z 42..58 and a
# bundle line z 61..64. Renderers gtnh:chisel_ctm, gtnh:iron_chest, gtnh:bibliocraft, gtnh:ae2_cable_bus,
# gtnh:enderio_conduit (gtnh-render mods/).
world: mod-renderers
extra_packs: [out/e2e-mods/bluemap-gtnh-resources-before.zip]
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: null

views:
  overview-flat:          # the whole scene from above
    position: [38, 5, 32]
    distance: 110
    mode: flat
    ortho: 1
  chisel-ctm:             # CTMX cubes (factory dots, wireframe, aluminium caution/crate, glass), fronts south
    position: [12, 6, 2]
    distance: 16
    rotation: 0
    angle: 1.1
  chisel-variation:       # V9, V4, R16, R9, R4 cubes
    position: [37, 6, 2]
    distance: 16
    rotation: 0
    angle: 1.1
  chisel-pillars:         # CTMV pillars/beams and CTMH bookshelf rows/walls
    position: [64, 6, 3]
    distance: 16
    rotation: 0.6
    angle: 1.1
  iron-chests:            # every Iron Chest type, facings rotating; iron chest in 4 facings; vanilla chests
    position: [10, 5, 13]
    distance: 13
    rotation: 0.4
    angle: 1.0
  bibliocraft-a:          # bookcases (7 woods), filled bookcase, shelves, potion shelf, rack, case, labels
    position: [16, 5, 19]
    distance: 16
    rotation: 0.3
    angle: 1.0
  bibliocraft-b:          # desk, seat, tables, armor stands, lamp, lantern, sign, pedestal, typewriter, chest...
    position: [50, 5, 19]
    distance: 16
    rotation: 0.3
    angle: 1.0
  bibliocraft-groups:     # 2x2 table group and a bookcase row
    position: [3, 5, 23]
    distance: 9
    rotation: 0.3
    angle: 1.0
  ae2-cables:             # controller + drive, glass/covered/smart/dense fluix cable line, riser with a T
    position: [10, 5, 31]
    distance: 14
    rotation: 0.3
    angle: 1.0
  ae2-parts:              # parts on the north sides of a covered cable line (terminals, buses, planes, ...)
    position: [8, 5, 33]
    distance: 10
    rotation: 3.14159
    angle: 1.1
  ae2-colours:            # 16 colours of glass and covered cable
    position: [10, 5, 37]
    distance: 12
    rotation: 0
    angle: 0.8
  enderio-conduits:       # one line per conduit type
    position: [4, 5, 50]
    distance: 14
    rotation: 0.5
    angle: 0.9
  enderio-bundle:         # item + fluid + power + redstone bundle line with an L turn
    position: [3, 5, 62]
    distance: 9
    rotation: 0.5
    angle: 0.9
  facades:                # AE2 facades (north + top of glass cables) and EnderIO bundle facades: stone, spruce planks, red wool, chisel
    position: [5, 5, 67]
    distance: 10
    rotation: 3.14159
    angle: 1.0
