# End-game plaza (`orch scene endgame`, the site demo's map): StructureLib multiblocks built and formed in rows on a
# superflat plaza (floor y=4, dump box (0,4,0)..(304,58,455)), controllers facing north: fusion reactors, compact
# fusion computers, mega multiblocks, processing, giants, Forge of the Gods (`machines` in scene.json). No browser
# views; one oracle camera per machine, framed like the demo's machine screenshots (from the north-west, flat machines
# from higher up). The camera block is generated: `uv run python -m e2e.oracle.machine_cameras` after the scene changes.
