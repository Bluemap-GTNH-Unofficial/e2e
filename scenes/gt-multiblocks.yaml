# GregTech multiblocks (`orch scene gt-multiblocks`): structures built with StructureLib (survival build, formed) around
# controllers at x = 0, 48, ..., 864, y=20, z=0, all facing north, structures extending south; the superflat ground is
# at y=4, so the structures float. Controllers and hatches: gtnh:gt_machine; casings: exporter models.
world: gt-multiblocks
extra_packs: [out/exporter/bluemap-gtnh-resources-2.9.0-RC-2.zip]
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: 0.005

views:
  # free-flight cameras north of each controller, looking south at the front
  ebf:
    position: [0.5, 22, -6]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  vacuum-freezer:
    position: [48.5, 22, -6]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  implosion-compressor:
    position: [96.5, 22, -6]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  lcr:
    position: [144.5, 22, -6]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  distillation-tower:
    position: [192.5, 25, -12]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  assembly-line:
    position: [240.5, 24, -14]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  large-turbine:
    position: [384.5, 22, -6]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  mega-ebf:
    position: [576.5, 28, -18]
    rotation: 3.14159
    angle: 1.35
    distance: 0
    mode: free
  ebf-side:               # EBF from the south-east (coils, hatches on the back)
    position: [6, 25, 8]
    rotation: -0.9
    angle: 1.0
    distance: 0
    mode: free
