# Vanilla block zoo (`orch scene vanilla-zoo`): superflat, 326 blocks on a 2-block grid at y=4,
# x 0..36, z 0..34 (out/scenes/vanilla-zoo/scene.json dump_box).
world: vanilla-zoo        # folder under <workspace>/worlds
extra_packs: [out/exporter/bluemap-gtnh-resources-2.9.0-RC-2.zip]
# maps: [overworld]       # default: one map per dimension with region files (D17)
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: 0.001

views:
  top-flat:               # whole grid, straight down, orthographic
    position: [18, 5, 17]
    distance: 30
    mode: flat
    ortho: 1
  perspective:            # whole grid from the south-west, 50 degrees down
    position: [18, 5, 17]
    distance: 45
    rotation: 0.6
    angle: 0.9

# World oracle (`e2e oracle world`): the perspective view above plus the grid from its four diagonals, so every side
# face of every block is seen by two cameras.
oracle:
  cameras:
    south-west: {eye: [2, 23, 33], look_at: [18, 5, 17]}
    south-east: {eye: [34, 23, 33], look_at: [18, 5, 17]}
    north-east: {eye: [34, 23, 1], look_at: [18, 5, 17]}
    north-west: {eye: [2, 23, 1], look_at: [18, 5, 17]}
