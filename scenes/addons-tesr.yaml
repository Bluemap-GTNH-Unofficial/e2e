# Close-ups of the community addon TESR blocks in the addons-multiblocks world (see addons-multiblocks.yaml for the
# layout), drawn by gtnh-render's `gtnh:addon_tesr` ports (render/mods/addons). Row 1 (default tile entity NBT) at
# y=5, z=-48, x = 0, 8, ..., 184; the active row (NBT set: beams on, rings shown, jar filled, paired beam formers) at
# y=5, z=-64 (beam former partner at z=-58). Cameras north of the rows, looking south.
world: addons-multiblocks
extra_packs: [out/exporter-addons/bluemap-gtnh-resources-2.9.0-RC-2-addons.zip]
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: 0.02

views:
  tst-row1:               # star (size 4), laser beacon (idle), eye of wood, solar boiler, arcane hole, power chair
    position: [20, 5, -48]
    distance: 34
    rotation: 3.14159
    angle: 1.1
  gtnl-row1-blocks:       # arcane hole, power chair, beam former, laser beacon, essentia jar, essentia tube
    position: [52, 5, -48]
    distance: 13
    rotation: 3.14159
    angle: 1.0
  gtnl-row1-figures:      # player doll, pigmee fumo, water candle, ender elevator
    position: [116, 5, -48]
    distance: 9
    rotation: 3.14159
    angle: 1.0
  boxpp-ring-cores:       # Box++ rings 1-3 unformed: only the small core ring
    position: [144, 5.5, -48]
    distance: 5
    rotation: 3.14159
    angle: 0.9
  oth-figures:            # 123T Ayanami, Asuka, tall hat
    position: [176, 5.5, -48]
    distance: 6
    rotation: 3.14159
    angle: 1.1
  active-gtnl:            # filled jar, paired beam formers, ender elevator (red), fumo (east), doll (south)
    position: [56, 5, -62]
    distance: 14
    rotation: 3.14159
    angle: 1.0
  active-top:             # map view from above: beams, stars, the formed ring
    position: [50, 5, -64]
    distance: 70
    mode: flat
    ortho: 1
  active-jar:             # essentia jar with ignis 1000 + aqua 500 (ignis active, on top)
    position: [36.5, 5.6, -63.5]
    distance: 3
    rotation: 3.14159
    angle: 1.1
  active-doll:            # player doll, meta 3 (facing south, away from the camera)
    position: [76.5, 5.6, -63.5]
    distance: 3.5
    rotation: 3.14159
    angle: 1.1
