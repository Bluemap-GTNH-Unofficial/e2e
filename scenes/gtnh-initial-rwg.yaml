# Initial GTNH realistic-world-gen overworld (first boot of the server pack, seed 1710, spawn -109, -65): the spawn
# area's populated chunks around the spawn.
world: gtnh-initial-rwg
extra_packs: ["{export}"]
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: 0.001

views:
  overview-flat:          # all populated terrain from above
    position: [-123, 64, -90]
    distance: 250
    mode: flat
    ortho: 1
  overview-perspective:   # terrain relief, 50 degrees down
    position: [-123, 64, -90]
    distance: 300
    rotation: 0.6
    angle: 0.9
