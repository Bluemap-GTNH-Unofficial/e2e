# GregTech ores (`orch scene gt-ores`): superflat, y=5, 2-block grid. gt.blockores2 x 0..124, z 0..120 (per material:
# normal and small ore, on every stone type), gt.blockores3..7 in the last row z 120..122.
# Renderer gtnh:gt_ore (stone background + tinted ore overlay by meta).
world: gt-ores
extra_packs: [out/exporter/bluemap-gtnh-resources-2.9.0-RC-2.zip]
viewport: [1280, 720]

defaults:
  map: overworld
  tolerance: {pixel: 24, ratio: 0.005}
  min_content: 0.05
  max_missing: 0.005

views:
  overview-flat:          # every ore from above
    position: [62, 5, 61]
    distance: 140
    mode: flat
    ortho: 1
  stone-closeup:          # first rows: ores on stone, normal and small alternating
    position: [10, 5, 3]
    distance: 14
    rotation: 0.4
    angle: 1.0
  other-stones:           # middle rows: other stone slots of gt.blockores2
    position: [60, 5, 60]
    distance: 14
    rotation: 0.4
    angle: 1.0
  space-stones:           # last row: gt.blockores3..7 (Mars .. Tuff)
    position: [60, 5, 121]
    distance: 20
    rotation: 0.4
    angle: 1.0
