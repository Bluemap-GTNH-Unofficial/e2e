[project]
name = "bmgtnh-e2e"
version = "0.1.0"
description = "Browser end-to-end checks of BlueMap GTNH maps: render scene worlds with the CLI, screenshot camera views, compare to baselines."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pillow>=11",
    "playwright>=1.50",
    "pyyaml>=6",
]

[project.scripts]
e2e = "e2e.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: renders scene worlds with the BlueMap CLI and drives Chromium (minutes per scene)"]
